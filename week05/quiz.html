<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles/quiz.css" rel="stylesheet">
    <title>Web Dev Fundamentals Quiz</title>
</head>

<body>
    <main>
        <h1>HTML & CSS Fundamentals Quiz</h1>
        <form>
            <label for="q1">1. Which HTML5 element should be used to wrap a set of navigation links?</label>
            <input type="text" id="q1" name="q1">

            <label for="q2">2. List the four components of the CSS Box Model, starting from the innermost layer.</label>
            <textarea id="q2" name="q2"></textarea>

            <label for="q3">3. Which selector targets all `p` elements that are direct children of a `div`
                element?</label>
            <select id="q3" name="q3">
                <option disabled selected>Choose one...</option>
                <option value="A">A. `div + p`</option>
                <option value="B">B. `div > p`</option>
                <option value="C">C. `div p`</option>
            </select>

            <label for="q4">4. What is the left padding given this declaration?</label>
            <div class="exampleCode">padding: 5px 10px 15px 20px;</div>
            <input type="number" id="q4" name="q4">

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
